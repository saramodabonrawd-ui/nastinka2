<style>

}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:24px 18px 32px;text-align:center}
h1{font-family:"Amiri",serif;font-size:2.4rem;margin:6px 0 4px}
.sub{margin:0 0 22px;color:var(--muted);font-weight:500}
.picker{display:flex;align-items:center;justify-content:center;gap:12px}
.step{width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);background:transparent;color:var(--ink);font:800 1.4rem "Cairo",sans-serif;cursor:pointer}
#num{width:130px;height:84px;text-align:center;font:800 2.6rem "Cairo",sans-serif;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:18px}
.range{color:var(--muted);margin:8px 0 18px;font-size:.9rem}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{font:800 1rem "Cairo",sans-serif;border-radius:999px;padding:12px 26px;cursor:pointer;border:2px solid var(--accent)}
.btn.main{background:var(--accent);color:var(--onaccent)}
.btn.alt{background:transparent;color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.scroll{margin-top:26px;background:var(--paper);border-radius:20px;padding:26px 20px;min-height:170px;display:flex;flex-direction:column;justify-content:center;gap:12px;border:1px solid var(--muted)}
.scroll.show{animation:rise .5s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.badge{align-self:center;font-weight:800;color:var(--accent);font-size:.95rem}
.quote{font-family:"Amiri",serif;font-size:1.6rem;line-height:1.9;margin:0}
.by{color:var(--muted);font-weight:800;margin:0}
.hint{color:var(--muted);margin:0}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);inset-inline-start:14px;font:800 .9rem "Cairo",sans-serif;background:transparent;color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.info{text-align:start;margin:4px 0 0;padding-top:12px;border-top:1px solid var(--muted)}
.info h3{margin:0 0 2px;font-size:.95rem;color:var(--accent)}
.info p{margin:0 0 10px;line-height:1.7}
.cats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px}
.chip{font:700 .85rem "Cairo",sans-serif;padding:6px 14px;border-radius:999px;border:1.5px solid var(--muted);background:transparent;color:var(--ink);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.seen{margin-top:16px;color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion: reduce){.scroll.show{animation:none}}
</style>
</head>

</main>

["الوجود يسبق الماهية.","Existence precedes essence.","sar","لا نولد بهوية جاهزة، بل نصنع أنفسنا بخياراتنا.","We are not born with a fixed identity; we make ourselves by our choices."],
["الجحيم هو الآخرون.","Hell is other people.","sar","نظرات الآخرين قد تحبسنا في صورة لا نختارها.","Others’ judgments can trap us in an image we did not choose."],
["يجب أن نتخيّل سيزيف سعيداً.","One must imagine Sisyphus happy.","cam","يمكن أن نجد معنى في الجهد نفسه حتى لو لم يكتمل العمل.","We can find meaning in the effort itself, even if the task never ends."],
["من يملك سبباً ليعيش يستطيع احتمال أي كيفية.","He who has a why to live can bear almost any how.","nie","المعنى يمنح القدرة على تحمّل الصعاب. (بتصرّف)","Meaning gives strength to endure hardship. (paraphrased)"],
["ما لا يقتلني يجعلني أقوى.","What does not kill me makes me stronger.","nie","المحن قد تصبح مصدر نموّ إن عبرناها."," Trials can become sources of growth once we get through them."],
["تُفهم الحياة بالنظر إلى الوراء، لكنها تُعاش إلى الأمام.","Life is understood backwards, but must be lived forwards.","kie","لا نرى المعنى كاملاً وقت الحدث، فنمضي رغم الغموض.","We rarely see the meaning in the moment, so we move on despite uncertainty."],
["حدود لغتي هي حدود عالمي.","The limits of my language mean the limits of my world.","wit","كلما اتسعت لغتنا اتسع ما نستطيع التفكير فيه.","The wider our language, the wider what we can think."],
["ما لا تريده لنفسك لا تفعله بالآخرين.","Do not do to others what you do not want done to yourself.","con","قاعدة ذهبية بسيطة للتعامل بعدل ورحمة.","A simple golden rule for treating others fairly and kindly."],
["رحلة الألف ميل تبدأ بخطوة واحدة.","A journey of a thousand miles begins with a single step.","lao","الأهداف الكبيرة تبدأ ببداية صغيرة.","Big goals begin with a small start."],
["لسنا نتألم من الأشياء، بل من أحكامنا عليها.","We are disturbed not by things, but by our views of them.","epi","تغيير نظرتنا للأمر يغيّر أثره فينا. (بتصرّف)","Changing how we see something changes how it affects us. (paraphrased)"],
["نعاني في خيالنا أكثر مما نعاني في الواقع.","We suffer more often in imagination than in reality.","sen","القلق من المستقبل يؤلمنا أكثر من وقوعه فعلاً.","Worry about the future hurts more than the events themselves."],
["لك سلطان على عقلك لا على الأحداث.","You have power over your mind, not outside events.","aur","ركّز على ما تملكه وهو ردّ فعلك. (بتصرّف)","Focus on what you control: your response. (paraphrased)"],
["الشك أول مراتب اليقين.","Doubt is the first step toward certainty.","gha","من يمحّص ما يعتقده يصل إلى قناعة أصلب. (منسوب إليه)","Those who test their beliefs reach firmer conviction. (attributed)"],
["اعرف نفسك.","Know thyself.","del","أقدم دعوات الفلسفة: ابدأ بفهم دوافعك وحدودك.","One of philosophy’s oldest calls: begin by understanding your motives and limits."],
["الظلم مؤذن بخراب العمران.","Injustice heralds the ruin of civilization.","khl","حين يسود الظلم تضعف الثقة والعمل ويتراجع المجتمع.","When injustice spreads, trust and work decline and society weakens."],
["الإنسان ابن عوائده ومألوفه، لا ابن طبيعته ومزاجه.","Man is the child of his habits and surroundings, not of his nature and temperament.","khl","للبيئة والعادة أثر في تكوين الشخص أكبر مما نظن. (بتصرّف)","Environment and habit shape a person more than we assume. (paraphrased)"],
["الفضيلة وسطٌ بين رذيلتين.","Virtue lies between two vices.","ari","الشجاعة مثلاً بين الجبن والتهوّر. (بتصرّف)","Courage, for example, sits between cowardice and recklessness. (paraphrased)"],
["من لا يحتاج إلى المجتمع فهو إما وحش أو إله.","One who needs no community is either a beast or a god.","ari","البشر يحتاجون بعضهم، ومن استغنى تماماً خرج عن الإنسانية. (بتصرّف)","Humans need each other; total self-sufficiency lies beyond the human. (paraphrased)"],
["أول الانتصارات وأعظمها أن تنتصر على نفسك.","The first and greatest victory is to conquer yourself.","pla","أصعب خصم هو الهوى والكسل داخلنا. (بتصرّف)","The hardest opponent is the desire and laziness within us. (paraphrased)"],
["ليس فقيراً من يملك القليل، بل من يشتهي المزيد.","It is not the man who has too little who is poor, but the one who craves more.","sen","الغنى رضا النفس لا كثرة المال. (بتصرّف)","Wealth is contentment, not the amount owned. (paraphrased)"],
["لا تهبّ ريحٌ موافقة لمن لا يعرف إلى أي ميناء يبحر.","No wind is favorable to a sailor who does not know which port he is heading for.","sen","من دون هدف واضح لا تنفعنا الفرص. (بتصرّف)","Without a clear goal, opportunities do not help us. (paraphrased)"],
["ما يعترض الطريق يصبح هو الطريق.","What stands in the way becomes the way.","aur","العقبة قد تتحول إلى فرصة إن غيّرنا نظرتنا إليها. (بتصرّف)","An obstacle can become an opportunity when we change how we see it. (paraphrased)"],
["تصطبغ النفس بلون أفكارها.","The soul takes on the color of its thoughts.","aur","ما نكرره في عقولنا يشكّل طبعنا. (بتصرّف)","What we repeat in our minds shapes our character. (paraphrased)"],
["يجب أن تحمل في داخلك فوضى لتلد نجماً راقصاً.","One must have chaos within to give birth to a dancing star.","nie","الإبداع غالباً يولد من الاضطراب لا من الهدوء التام. (بتصرّف)","Creativity is often born of turmoil rather than perfect calm. (paraphrased)"],
["من يحارب الوحوش فليحذر أن يصير وحشاً.","Whoever fights monsters should see to it that he does not become one.","nie","الغاية النبيلة لا تبرّر أن نتخلى عن إنسانيتنا. (بتصرّف)","A noble aim does not excuse losing our humanity. (paraphrased)"],
["تجرّأ على استخدام عقلك.","Dare to use your own reason.","kan","شعار التنوير: فكّر بنفسك ولا تنتظر وصاية أحد.","The motto of the Enlightenment: think for yourself."],
["عامل الإنسان دائماً كغاية، لا كوسيلة فقط.","Treat humanity always as an end, never merely as a means.","kan","كرامة الإنسان تمنع استعماله كأداة. (بتصرّف)","Human dignity forbids using people as mere tools. (paraphrased)"],
["العقل عبدٌ للعواطف، ولا ينبغي له إلا أن يكون كذلك.","Reason is, and ought only to be, the slave of the passions.","hum","رأى هيوم أن رغباتنا هي ما يحرّكنا، والعقل يخدمها.","Hume held that desires move us, and reason serves them."],
["أن تكون سقراطاً غير راضٍ خير من أن تكون أحمق راضياً.","Better to be Socrates dissatisfied than a fool satisfied.","mil","جودة السعادة أهم من مجرد الشعور بالرضا. (بتصرّف)","The quality of happiness matters more than mere contentment. (paraphrased)"],
["يولد الإنسان حراً، وهو في كل مكان مكبّل بالقيود.","Man is born free, and everywhere he is in chains.","rou","افتتاح كتابه العقد الاجتماعي، ينتقد فيه ما يقيّد الحرية في المجتمعات.","The opening of The Social Contract, questioning what limits freedom in society."],
["حياة الإنسان في حالة الفوضى وحشية وقصيرة.","In the state of nature, life is nasty, brutish and short.","hob","رأى هوبز أن غياب السلطة يقود إلى صراع دائم. (بتصرّف)","Hobbes argued that without authority, conflict is constant. (paraphrased)"],
["كل مشكلات البشر تنبع من عجزهم عن الجلوس بهدوء في غرفة وحدهم.","All of humanity’s problems stem from man’s inability to sit quietly in a room alone.","pas","نهرب من أنفسنا بالانشغال المستمر. (بتصرّف)","We escape ourselves through constant busyness. (paraphrased)"],
["كل إنسان يظن حدود رؤيته هي حدود العالم.","Everyone takes the limits of their own vision for the limits of the world.","sch","تنبيه إلى أن معرفتنا محدودة بما نراه. (بتصرّف)","A reminder that our knowledge is limited by what we see. (paraphrased)"],
["في قلب الشتاء، تعلمت أخيراً أن في داخلي صيفاً لا يُقهر.","In the midst of winter, I found there was within me an invincible summer.","cam","حتى في أصعب الأوقات نجد قوة داخلية لا تنكسر. (بتصرّف)","Even in the hardest times we find an unbreakable inner strength. (paraphrased)"],
["لا يولد المرء امرأة، بل يصير كذلك.","One is not born, but rather becomes, a woman.","bea","الأدوار الاجتماعية تُصنع بالتربية والمجتمع لا بالولادة وحدها.","Social roles are shaped by upbringing and society, not birth alone."],
["خُلق الإنسان قدره.","Character is destiny.","her","ما نكونه يصنع ما يحدث لنا أكثر مما نتصور. (بتصرّف)","Who we are shapes what happens to us more than we think. (paraphrased)"],
["من عرف الآخرين فهو ذكي، ومن عرف نفسه فهو مستنير.","Knowing others is intelligence; knowing yourself is true wisdom.","lao","فهم الذات أعمق وأصعب من فهم الناس. (بتصرّف)","Understanding yourself is deeper and harder than understanding others. (paraphrased)"],
["أكنتُ رجلاً يحلم أنه فراشة، أم فراشة تحلم أنها رجل؟","Was I a man dreaming I was a butterfly, or a butterfly dreaming I was a man?","zhu","سؤال عن حدود الحلم والواقع وكيف نثق بما ندركه. (بتصرّف)","A question about dream and reality, and how far we can trust what we perceive. (paraphrased)"],
["الموت لا يعنينا: ما دمنا موجودين لا يوجد، وإذا وُجد لسنا موجودين.","Death is nothing to us: while we exist it is not, and when it comes we are not.","epk","حجة أبيقور لتخفيف الخوف من الموت. (بتصرّف)","Epicurus’s argument for easing the fear of death. (paraphrased)"],
["الشك حالة غير مريحة، لكن اليقين حالة سخيفة.","Doubt is not a pleasant condition, but certainty is an absurd one.","vol","الاقتناع المطلق قد يغلق باب التفكير. (بتصرّف)","Total certainty can close the door to thinking. (paraphrased)"],
["مشكلة العالم أن الحمقى واثقون من أنفسهم والعقلاء مليئون بالشك.","The trouble with the world is that the stupid are cocksure and the intelligent full of doubt.","rus","الثقة العالية ليست دليلاً على صواب الرأي. (بتصرّف)","High confidence is not proof of being right. (paraphrased)"],
["ما لا نستطيع الحديث عنه، علينا أن نصمت عنه.","Whereof one cannot speak, thereof one must be silent.","wit","جملة ختام كتابه الشهير، تضع حدوداً لما يمكن قوله بوضوح.","The closing line of his famous book, setting limits on what can be said clearly."],
["القلق هو دوار الحرية.","Anxiety is the dizziness of freedom.","kie","حين تكثر الخيارات نشعر بثقل المسؤولية.","With many choices comes the weight of responsibility."],
["الحق لا يضادّ الحق، بل يوافقه ويشهد له.","Truth does not contradict truth; it agrees with it and bears witness to it.","rsh","دعا ابن رشد إلى الانسجام بين العقل والدين وعدم رؤيتهما خصمين. (بتصرّف)","Averroes argued for harmony between reason and religion rather than conflict. (paraphrased)"],
["لا ينبغي أن نستحي من اقتناء الحق من أين أتى، ولو جاء من أمم بعيدة عنا.","We should not be ashamed to accept truth from wherever it comes, even from distant peoples.","kin","دعوة مبكرة للانفتاح على معارف الأمم الأخرى. (بتصرّف)","An early call to learn from the knowledge of other nations. (paraphrased)"],
["العلم بلا عمل جنون، والعمل بغير علم لا يكون.","Knowledge without action is madness, and action without knowledge is nothing.","gha","المعرفة تكتمل بالتطبيق، والتطبيق يحتاج فهماً. (منسوب إليه)","Knowledge is completed by practice, and practice needs understanding. (attributed)"],
["ما هو الزمن؟ إن لم يسألني أحد عرفته، وإن أردت شرحه لا أعرفه.","What then is time? If no one asks me, I know; if I wish to explain it, I do not know.","aug","سؤال صعب عن أشياء نظنها واضحة. (بتصرّف)","A hard question about something we think is obvious. (paraphrased)"],
["الإنسان مقياس كل شيء.","Man is the measure of all things.","pro","رأى بروتاغوراس أن الحكم على الأمور يرتبط بالإنسان وتجربته.","Protagoras held that judgments depend on human experience."],
["الطبيعة الإنسانية خيّرة في أصلها.","Human nature is good in its origin.","men","رأى منسيوس أن في الإنسان بذرة طيبة تحتاج إلى رعاية. (بتصرّف)","Mencius saw in each person a good seed that needs nurturing. (paraphrased)"],
["ماذا أعرف؟","What do I know?","mon","شعار مونتين: السؤال المستمر أهم من ادّعاء المعرفة.","Montaigne’s motto: continuing to ask matters more than claiming knowledge."],
["المعرفة قوة.","Knowledge is power.","bac","فهم الطبيعة والعالم يمنحنا القدرة على التأثير فيهما.","Understanding nature and the world gives us the power to act on them."],
["لا تفتح بومة مينرفا جناحيها إلا عند حلول الغسق.","The owl of Minerva spreads its wings only with the falling of dusk.","heg","نفهم الأحداث غالباً بعد انتهائها لا أثناءها. (بتصرّف)","We often understand events only after they are over. (paraphrased)"],
["اكتفى الفلاسفة بتفسير العالم بطرق مختلفة، والمهم هو تغييره.","Philosophers have only interpreted the world in various ways; the point is to change it.","mar","دعوة لربط التفكير بالفعل والتغيير. (بتصرّف)","A call to connect thinking with action. (paraphrased)"],
["الغاية القصوى للحياة هي السعادة.","The highest aim of life is happiness.","ari","السعادة عند أرسطو ازدهار الإنسان بالفضيلة لا مجرد المتعة. (بتصرّف)","For Aristotle, happiness means flourishing through virtue, not mere pleasure. (paraphrased)"],
["العدالة أن يؤدي كل إنسان العمل الذي يناسبه.","Justice is each person doing the work that suits them.","pla","فكرة العدالة في الجمهورية: كل فرد في موضعه المناسب. (بتصرّف)","The idea of justice in the Republic: each in their proper place. (paraphrased)"],
["إن أردت أن تتحسّن فاقبل أن يُظنّ بك الجهل.","If you wish to improve, be content to be thought foolish.","epi","التعلّم يتطلب التواضع وعدم الخوف من نظرة الناس. (بتصرّف)","Learning requires humility and not fearing others’ opinions. (paraphrased)"],
["قيمة الحياة ليست في طولها بل في جودة ما نفعله بها.","Life is measured not by its length but by how well we live it.","sen","قيمة العمر في ما نصنعه به. (بتصرّف)","The value of a life lies in what we do with it. (paraphrased)"],
["قليلٌ هو ما يحتاجه المرء ليحيا حياة سعيدة.","Very little is needed to make a happy life.","aur","السعادة لا تتطلب الكثير، وهي في طريقة تفكيرنا. (بتصرّف)","Happiness needs little and lies in how we think. (paraphrased)"],
["إن لم يكن الأمر صحيحاً فلا تقله، وإن لم يكن عادلاً فلا تفعله.","If it is not true, do not say it; if it is not right, do not do it.","aur","قاعدة بسيطة للصدق والعدل في القول والفعل. (بتصرّف)","A simple rule for honesty and fairness in word and deed. (paraphrased)"],
["ما يُفعل من أجل الحب يقع دائماً وراء الخير والشر.","What is done out of love always takes place beyond good and evil.","nie","الحب يتجاوز الحسابات الأخلاقية الجامدة. (بتصرّف)","Love goes beyond rigid moral calculation. (paraphrased)"],
["أمران يملآن القلب بالدهشة: السماء المرصّعة فوقي والقانون الأخلاقي في داخلي.","Two things fill the mind with wonder: the starry heavens above me and the moral law within me.","kan","دهشة الكون ودهشة الضمير معاً. (بتصرّف)","Wonder at the universe and wonder at conscience together. (paraphrased)"],
["الإنسان محكوم عليه بأن يكون حراً.","Man is condemned to be free.","sar","لا مفرّ من الاختيار، ومسؤوليتنا عن خياراتنا لا تسقط.","We cannot avoid choosing, and we remain responsible for our choices."],
["النضال نفسه نحو القمم يكفي لملء قلب الإنسان.","The struggle itself toward the heights is enough to fill a man’s heart.","cam","المعنى يكمن في السعي لا في الوصول فقط. (بتصرّف)","Meaning lies in the striving, not only in arriving. (paraphrased)"],
["الفلسفة معركة ضد سحر اللغة لعقولنا.","Philosophy is a battle against the bewitchment of our minds by language.","wit","الكلمات قد تُربكنا فنظن أن المشكلة في العالم وهي في اللغة. (بتصرّف)","Words can confuse us so that we blame the world for problems of language. (paraphrased)"],
["الإنسان قصبة ضعيفة، لكنه قصبة مفكّرة.","Man is a thinking reed.","pas","ضعيف جسدياً أمام الكون، لكن عظمته في تفكيره. (بتصرّف)","Physically frail before the universe, yet great in his thinking. (paraphrased)"],
["العقل أعدل الأشياء قسمةً بين الناس.","Good sense is the best distributed thing in the world.","des","يرى ديكارت أن القدرة على التفكير موجودة عند الجميع، والمهم حسن استعمالها. (بتصرّف)","Descartes thought everyone can reason; what matters is using it well. (paraphrased)"],
["كل الأشياء الرائعة صعبة بقدر ما هي نادرة.","All things excellent are as difficult as they are rare.","spi","السطر الأخير من كتاب الأخلاق: الإنجازات الكبيرة صعبة ونادرة.","The closing line of the Ethics: great achievements are hard and rare."],
["الخوف هو المصدر الرئيس للخرافة وأحد مصادر القسوة.","Fear is the main source of superstition and one of the main sources of cruelty.","rus","ما نخافه يشكّل ما نصدّقه وكيف نعامل الآخرين. (بتصرّف)","What we fear shapes what we believe and how we treat others. (paraphrased)"],
["من لا يعرف إلا جانبه من القضية يعرف عنها القليل.","He who knows only his own side of the case knows little of that.","mil","لا نفهم رأينا حقاً إلا بعد أن نسمع حجج المخالفين. (بتصرّف)","We truly understand our view only after hearing opposing arguments. (paraphrased)"],
["التعلّم دون تفكير ضياع، والتفكير دون تعلّم خطر.","Learning without thought is labor lost; thought without learning is perilous.","con","التوازن بين التلقّي والتفكير النقدي. (بتصرّف)","A balance between taking in knowledge and thinking critically. (paraphrased)"],
["الماء أرقّ الأشياء، ومع ذلك يغلب الصلب.","Nothing is softer than water, yet it overcomes the hard.","lao","اللين والمرونة قد يتفوقان على القوة المباشرة. (بتصرّف)","Gentleness and flexibility can outdo direct force. (paraphrased)"],
["من يطلب الحق عليه أن يجعل نفسه خصماً لكل ما ينظر فيه.","The seeker of truth should make himself an adversary of everything he reads.","hay","دعا ابن الهيثم إلى الشك المنهجي وفحص كل رأي بالدليل. (بتصرّف)","Ibn al-Haytham urged methodical doubt and testing every claim with evidence. (paraphrased)"],
["السعادة هي الخير الذي يُطلب لذاته لا لغيره.","Happiness is the good sought for its own sake and not for anything else.","far","رأى الفارابي أن السعادة غاية الحياة لا وسيلة لشيء آخر. (بتصرّف)","Al-Farabi saw happiness as the end of life, not a means to something else. (paraphrased)"],
["العقل في البدء كلوح أبيض، وكل معرفتنا تأتي من التجربة.","The mind begins as a blank slate, and all our knowledge comes from experience.","loc","أساس الفكر التجريبي: نتعلّم بما نمرّ به لا بأفكار فطرية. (بتصرّف)","The root of empiricism: we learn from what we live through, not innate ideas. (paraphrased)"],
["أن نتفلسف هو أن نتعلّم كيف نموت.","To philosophize is to learn how to die.","cic","التأمل في النهاية يعلّمنا قيمة الحياة والشجاعة أمامها. (بتصرّف)","Thinking about our end teaches us the value of life and courage before it. (paraphrased)"],
["الأفضل أن تكون مهاباً من أن تكون محبوباً إن لم تستطع الجمع بينهما.","It is better to be feared than loved, if you cannot be both.","mac","رأي واقعي في السلطة من كتاب الأمير، ما زال مثار جدل. (بتصرّف)","A realist view of power from The Prince, still debated today. (paraphrased)"],
["قد أكون مخطئاً وقد تكون أنت على حق، وبالجهد المشترك نقترب من الحقيقة.","I may be wrong and you may be right, and by an effort we may get nearer to the truth.","pop","روح الحوار العلمي: الاختلاف طريق إلى الحقيقة. (بتصرّف)","The spirit of scientific dialogue: disagreement is a path to truth. (paraphrased)"],
["لماذا يوجد شيء بدلاً من لا شيء؟","Why is there something rather than nothing?","lei","من أعمق أسئلة الفلسفة عن أصل الوجود نفسه.","One of philosophy’s deepest questions, about the origin of existence itself."],
["الوجود هو أن يُدرَك.","To be is to be perceived.","ber","رأى بيركلي أن الأشياء لا نعرف وجودها إلا من خلال إدراكنا لها. (بتصرّف)","Berkeley held that we know things exist only through perceiving them. (paraphrased)"],
["الطريق صعوداً وهبوطاً واحد.","The way up and the way down are one and the same.","her","الأضداد تبدو متعارضة لكنها وجهان لحقيقة واحدة. (بتصرّف)","Opposites seem to conflict but are two sides of one reality. (paraphrased)"],
["الفضيلة هي المعرفة.","Virtue is knowledge.","soc","من يعرف الخير حقاً يفعله، والشر عنده نتيجة جهل. (بتصرّف)","Whoever truly knows the good will do it; wrongdoing comes from ignorance. (paraphrased)"],
["كل البشر يرغبون بطبعهم في المعرفة.","All human beings by nature desire to know.","ari","افتتاح كتاب ما بعد الطبيعة: الفضول هو بداية الفلسفة.","The opening of the Metaphysics: curiosity is where philosophy starts."],
["أكبر عقوبة لمن يرفض المشاركة في الشأن العام أن يحكمه من هو أقل منه.","The penalty for refusing to take part in public life is to be ruled by lesser people.","pla","التهرّب من المسؤولية العامة قد يسلّم القرار لمن لا يستحق. (بتصرّف)","Avoiding public responsibility can hand decisions to the less deserving. (paraphrased)"],
["من الخشب المعوجّ للإنسانية لم يُصنع شيء مستقيم قط.","Out of the crooked timber of humanity, no straight thing was ever made.","kan","الكمال البشري غير ممكن، فلنتوقع النقص ونتسامح معه. (بتصرّف)","Human perfection is impossible, so expect imperfection and be tolerant. (paraphrased)"],
["لا حقائق، بل تأويلات فقط.","There are no facts, only interpretations.","nie","كل فهم للعالم يمرّ من خلال وجهة نظر. (بتصرّف)","Every understanding of the world passes through a point of view. (paraphrased)"],
["من دون الموسيقى ستكون الحياة خطأً.","Without music, life would be a mistake.","nie","تعبير عن قدرة الفن على منح الحياة معنى وجمالاً.","An expression of art’s power to give life meaning and beauty."],
["لا يكون المرء نفسه حقاً إلا ما دام وحيداً.","A man can be himself only so long as he is alone.","sch","رأى شوبنهاور أن العزلة تحمي أصالتنا من ضغط الآخرين. (بتصرّف)","Schopenhauer felt solitude protects our authenticity from others’ pressure. (paraphrased)"],
["أعظم ما في العالم أن يعرف المرء كيف يكون مالكاً لنفسه.","The greatest thing in the world is to know how to belong to oneself.","mon","الاستقلال الداخلي أساس الحرية الحقيقية. (بتصرّف)","Inner independence is the basis of real freedom. (paraphrased)"],
["علينا أن نزرع حديقتنا.","We must cultivate our garden.","vol","خاتمة كانديد: بدل الجدل الفارغ، اعمل بما بين يديك.","The ending of Candide: instead of idle debate, work on what is in your hands."],
["لو كان أنف كليوباترة أقصر، لتغيّر وجه الأرض.","Had Cleopatra’s nose been shorter, the whole face of the earth would have changed.","pas","ملاحظة ساخرة عن أثر التفاصيل الصغيرة في التاريخ. (بتصرّف)","A wry note on how small details can shape history. (paraphrased)"],
["الفلسفة هي عصرها مُدرَكاً بالفكر.","Philosophy is its own time comprehended in thought.","heg","الفكر ابن زمانه، يحاول فهم ما يعيشه. (بتصرّف)","Thought is a child of its time, trying to grasp what it lives through. (paraphrased)"],
["اسأل نفسك إن كنت سعيداً، فتتوقف عن أن تكون كذلك.","Ask yourself whether you are happy, and you cease to be so.","mil","السعادة تأتي غالباً كأثر جانبي للانشغال بهدف أكبر. (بتصرّف)","Happiness often comes as a side effect of pursuing a larger aim. (paraphrased)"],
["لا تُفسد ما تملك بالرغبة فيما لا تملك.","Do not spoil what you have by desiring what you have not.","epk","القناعة تحمي من الشعور الدائم بالنقص. (بتصرّف)","Contentment protects us from a constant sense of lack. (paraphrased)"],
["الصعاب تقوّي العقل كما يقوّي العمل الجسد.","Difficulties strengthen the mind, as labor does the body.","sen","المشقة تدرّبنا على الصبر والحكمة. (بتصرّف)","Hardship trains us in patience and wisdom. (paraphrased)"],
["الإنسان هو المخلوق الوحيد الذي يرفض أن يكون ما هو عليه.","Man is the only creature who refuses to be what he is.","cam","من كتاب المتمرّد: قدرتنا على الاعتراض هي ما يميّزنا. (بتصرّف)","From The Rebel: our capacity to say no is what sets us apart. (paraphrased)"],
["الحكيم يطلب ما يجده في نفسه، والسفيه يطلبه من الآخرين.","The wise person looks for it in himself; the lesser person looks to others.","con","المسؤولية عن أخطائنا ونجاحاتنا تبدأ من الداخل. (بتصرّف)","Responsibility for our failures and successes begins within. (paraphrased)"],
["من عرف أن لديه ما يكفي فهو غنيّ.","He who knows he has enough is rich.","lao","الغنى شعور بالاكتفاء لا حجم الملكية. (بتصرّف)","Wealth is a feeling of enough, not the size of possessions. (paraphrased)"],
["الاجتماع الإنساني ضروري.","Human society is necessary.","khl","رأى ابن خلدون أن الإنسان لا يعيش ولا يتقدّم إلا في جماعة.","Ibn Khaldun held that humans can neither live nor progress except together."],
["الحكمة هي صاحبة الشريعة والأخت الرضيعة.","Wisdom is the companion of the Law and its foster-sister.","rsh","عبّر ابن رشد عن قرب الفلسفة من الدين وتكاملهما. (بتصرّف)","Averroes expressed the closeness and complementarity of philosophy and religion. (paraphrased)"],
["أدين بدين الحب أنّى توجّهت ركائبه.","I follow the religion of love, wherever its caravans turn.","arb","من أشهر أبيات ابن عربي في المحبة والانفتاح. (بتصرّف)","One of Ibn Arabi’s best-known lines on love and openness. (paraphrased)"],
["خفّف الوطء، ما أظنّ أديم الأرض إلا من هذه الأجساد.","Tread lightly; the surface of the earth, I think, is made of these bodies.","maa","بيت شهير يتأمل تعاقب الأجيال ويدعو للتواضع أمام الموت. (بتصرّف)","A famous verse on the passing of generations, calling for humility before death. (paraphrased)"],
["لا يصيب الإنسانَ الصالح شرٌّ، لا في حياته ولا بعد موته.","No evil can happen to a good person, either in life or after death.","soc","فكرة من دفاع سقراط: الضمير النقي يحمينا من الخسارة الحقيقية. (بتصرّف)","An idea from Socrates’s defense: a clear conscience protects us from real loss. (paraphrased)"],
["الشجاعة أن تعرف ما لا ينبغي أن تخافه.","Courage is knowing what not to fear.","pla","الشجاع يميّز المخاوف الحقيقية من الوهمية. (منسوب إليه)","The courageous tell real fears from imagined ones. (attributed)"],
["الصديق نفس واحدة في جسدين.","A friend is one soul in two bodies.","ari","وصف مشهور للصداقة العميقة. (منسوب إليه)","A famous description of deep friendship. (attributed)"],
["الشمس جديدة كل يوم.","The sun is new each day.","her","كل يوم بداية جديدة، حتى لو بدا مثل ما قبله. (بتصرّف)","Each day is a fresh beginning, even if it looks like the last. (paraphrased)"],
["من لا يكفيه القليل لا يكفيه شيء.","Nothing is enough for the person to whom enough is too little.","epk","القناعة شرط الاكتفاء، فالطمع لا يشبع. (بتصرّف)","Contentment is the condition of having enough; greed is never filled. (paraphrased)"],
["من الأشياء ما هو بأيدينا ومنها ما ليس بأيدينا.","Some things are up to us and some are not.","epi","أول درس رواقي: اهتم بما تتحكم به واترك الباقي. (بتصرّف)","The first Stoic lesson: care about what you control and release the rest. (paraphrased)"],
["أمسِك بكل ساعة في يدك.","Hold every hour in your grasp.","sen","استثمر وقتك فهو أثمن ما نملك. (بتصرّف)","Use your time well; it is the most precious thing we have. (paraphrased)"],
["أفضل انتقام ألّا تكون مثل من أساء إليك.","The best revenge is not to be like your enemy.","aur","الارتقاء الأخلاقي أقوى من الردّ بالمثل. (بتصرّف)","Moral elevation is stronger than answering in kind. (paraphrased)"],
["الإنسان ليس إلا ما يصنعه بنفسه.","Man is nothing other than what he makes of himself.","sar","نحن مسؤولون عن تشكيل ذواتنا بخياراتنا. (بتصرّف)","We are responsible for shaping ourselves through our choices. (paraphrased)"],
["لا تنتظر الحكم الأخير، فهو يحدث كل يوم.","Do not wait for the last judgment; it takes place every day.","cam","نحاسب أنفسنا كل يوم على ما نفعل، لا في نهاية العمر فقط. (بتصرّف)","We answer for our actions daily, not only at the end of life. (paraphrased)"],
["الذاتية هي الحقيقة.","Subjectivity is truth.","kie","بعض الحقائق لا تُفهم إلا بتجربتها وعيشها شخصياً. (بتصرّف)","Some truths are understood only by living them personally. (paraphrased)"],
["أن تريد نفسك حرّة يعني أن تريد الآخرين أحراراً.","To will oneself free is also to will others free.","bea","حريتي لا تكتمل إلا بحرية من حولي. (بتصرّف)","My freedom is not complete without the freedom of those around me. (paraphrased)"],
["كن ما أنت عليه.","Become who you are.","nie","دعوة لاكتشاف الذات وتحقيقها بدل تقليد الآخرين. (بتصرّف)","A call to discover and realize yourself instead of imitating others. (paraphrased)"],
["إذا رأيت صالحاً فتشبّه به، وإذا رأيت غير ذلك فافحص نفسك.","When you see a good person, aim to be like them; when you see the opposite, examine yourself.","con","التعلّم من القدوة ومحاسبة النفس. (بتصرّف)","Learning from role models and holding yourself to account. (paraphrased)"],
["الحكيم يضع نفسه أخيراً فيجد نفسه أولاً.","The sage puts himself last and finds himself first.","lao","التواضع يجلب الاحترام أكثر من التفاخر. (بتصرّف)","Humility earns more respect than boasting. (paraphrased)"],
["المصيدة وُجدت للسمك، فإذا نلت السمك نسيت المصيدة.","The trap exists because of the fish; once you have the fish, you forget the trap.","zhu","الكلمات وسائل لنقل المعنى، فلا تتمسّك بها أكثر من المعنى. (بتصرّف)","Words are tools for carrying meaning; do not cling to them more than to the meaning. (paraphrased)"],
["العظيم من لم يفقد قلبَ الطفل.","A great person is one who has not lost the heart of a child.","men","الصفاء والفضول يبقيان أخلاقنا حيّة. (بتصرّف)","Sincerity and curiosity keep our character alive. (paraphrased)"],
["حيث لا قانون لا توجد حرية.","Where there is no law, there is no freedom.","loc","القانون العادل يحمي حرية الجميع من التعسّف. (بتصرّف)","A fair law protects everyone’s freedom from arbitrariness. (paraphrased)"],
["الطبيعة لا تخدعنا أبداً، نحن من نخدع أنفسنا.","Nature never deceives us; it is we who deceive ourselves.","rou","ما نسمّيه خداعاً غالباً هو سوء فهمنا. (بتصرّف)","What we call deception is often our own misreading. (paraphrased)"],
["الغاية الوحيدة التي تبرّر التدخل في حرية إنسان هي منع الأذى عن الآخرين.","The only purpose for interfering with a person’s liberty is to prevent harm to others.","mil","ما يُعرف بمبدأ الضرر: الحرية تنتهي عند إيذاء غيرك. (بتصرّف)","Known as the harm principle: freedom ends where harming others begins. (paraphrased)"],
["تتأرجح الحياة كالبندول بين الألم والملل.","Life swings like a pendulum between pain and boredom.","sch","نظرة متشائمة تقول إن الرغبة تؤلم والإشباع يُملّ. (بتصرّف)","A pessimistic view: desire hurts and fulfillment bores. (paraphrased)"],
["لم يتحقق شيء عظيم في العالم دون شغف.","Nothing great in the world has been accomplished without passion.","heg","الشغف هو المحرّك وراء الإنجازات الكبرى. (بتصرّف)","Passion is the engine behind great achievements. (paraphrased)"],
["لا تُقهر الطبيعة إلا بطاعتها.","Nature to be commanded must be obeyed.","bac","لكي نتحكم بالطبيعة علينا أن نفهم قوانينها أولاً. (بتصرّف)","To harness nature we must first understand its laws. (paraphrased)"],
["ثلاث عواطف حكمت حياتي: الشوق إلى الحب، والبحث عن المعرفة، والشفقة على آلام البشر.","Three passions have governed my life: the longing for love, the search for knowledge, and pity for human suffering.","rus","بداية سيرته الذاتية، يلخّص بها ما أعطى حياته معناها. (بتصرّف)","From the opening of his autobiography, summing up what gave his life meaning. (paraphrased)"],
["لا بدّ مرة في العمر أن نشكّ في كل شيء قدر الإمكان.","Once in our life we must doubt, as far as possible, all things.","des","الشك المنهجي عند ديكارت طريق إلى أساس متين للمعرفة. (بتصرّف)","Descartes’s methodical doubt is a path to firm foundations for knowledge. (paraphrased)"],
["الكتاب هو الجليس الذي لا يطريك، والرفيق الذي لا يملّك.","A book is the companion that does not flatter you, and the friend that never bores you.","jah","مدح الجاحظ الكتاب كصديق صادق يرافقنا دون ملل. (بتصرّف)","Al-Jahiz praised books as honest friends who stay with us without tiring. (paraphrased)"],
["المغلوب مولع أبداً بالاقتداء بالغالب.","The defeated are always eager to imitate the victor.","khl","ملاحظة اجتماعية عن تأثير القوة والغلبة في تقليد الثقافات. (بتصرّف)","A social observation on how power shapes cultural imitation. (paraphrased)"],
["اثنان أهل الأرض: ذو عقل بلا دين، وآخر دَيِّنٌ لا عقل له.","Two kinds of people live on earth: one has reason without religion, the other religion without reason.","maa","بيت جريء من اللزوميات يعبّر عن شكّه ودعوته لاحترام العقل. (بتصرّف)","A bold verse from the Luzumiyyat expressing his doubt and call to honor reason. (paraphrased)"],
["هبطتْ إليك من المحلّ الأرفعِ ورقاءُ ذاتُ تعزّزٍ وتمنّعِ.","It descended to you from the highest abode, a dove, proud and reluctant.","sin","من قصيدة النفس لابن سينا، يتخيّل فيها الروح قادمة من عالم أعلى. (بتصرّف)","From Ibn Sina’s Ode of the Soul, imagining the soul as coming from a higher realm. (paraphrased)"],
["الخير الوحيد هو المعرفة، والشر الوحيد هو الجهل.","The only good is knowledge, and the only evil is ignorance.","soc","فكرة سقراطية تجعل التعلّم أساس الأخلاق. (منسوب إليه)","A Socratic idea that makes learning the basis of ethics. (attributed)"],
["لن تهدأ المدن حتى يتفلسف الملوك أو يصير الفلاسفة ملوكاً.","Cities will have no rest until kings become philosophers or philosophers become kings.","pla","فكرة الحاكم الفيلسوف في الجمهورية. (بتصرّف)","The idea of the philosopher-king in the Republic. (paraphrased)"],
["نصير عادلين بفعل الأعمال العادلة.","We become just by doing just acts.","ari","الفضائل تُكتسب بالممارسة والعادة لا بالمعرفة وحدها. (بتصرّف)","Virtues are acquired through practice and habit, not knowledge alone. (paraphrased)"],
["لا يوجد في الحقيقة إلا الذرّات والفراغ.","In truth there is nothing but atoms and void.","dem","من أقدم تصوّرات المادة التي مهّدت للعلم الحديث. (بتصرّف)","One of the earliest views of matter, paving the way for modern science. (paraphrased)"],
["أعظم ما تحصّله الحكمة لسعادة العمر كله هو الصداقة.","Of all that wisdom provides for a happy life, the greatest is friendship.","epk","رأى أبيقور أن الأصدقاء أهم من المال والمكانة. (بتصرّف)","Epicurus ranked friends above wealth and status. (paraphrased)"],
["لدينا أذنان وفم واحد، لنسمع أكثر مما نتكلم.","We have two ears and one mouth so that we may listen more than we speak.","zen","دعوة للإنصات قبل الكلام. (منسوب إليه)","A call to listen before speaking. (attributed)"],
["لا تطلب أن تحدث الأشياء كما تريد، بل أرِد ما يحدث كما يحدث.","Do not demand that things happen as you wish, but wish that they happen as they do.","epi","الطمأنينة تبدأ بقبول ما لا نستطيع تغييره. (بتصرّف)","Calm begins with accepting what we cannot change. (paraphrased)"],
["نحن نتعلّم للمدرسة لا للحياة.","We learn for school, not for life.","sen","عتاب سينيكا على تعليم ينفصل عن الحياة الواقعية. (بتصرّف)","Seneca’s complaint about education cut off from real life. (paraphrased)"],
["كل ما نسمعه رأي لا حقيقة، وكل ما نراه وجهة نظر لا الحقيقة.","Everything we hear is an opinion, not a fact; everything we see is a perspective, not the truth.","aur","تذكير بالتمييز بين الواقع وتفسيرنا له. (منسوب إليه)","A reminder to separate reality from our interpretation of it. (attributed)"],
["الجمهور هو اللاحقيقة.","The crowd is untruth.","kie","رأى كيركغارد أن الاختباء خلف الجماعة يهرّبنا من مسؤولية الموقف الشخصي. (بتصرّف)","Kierkegaard felt hiding in the crowd lets us flee personal responsibility. (paraphrased)"],
["حين أختار لنفسي أختار للبشر كافة.","In choosing for myself, I choose for all humanity.","sar","كل خيار نتخذه يرسم صورة عن الإنسان الذي نريده. (بتصرّف)","Each choice we make sketches the kind of person we wish humanity to be. (paraphrased)"],
["المهم ليس أفضل حياة، بل أكثر حياة.","What counts is not the best living but the most living.","cam","دعوة لعيش التجربة بكامل الوعي والحضور. (بتصرّف)","A call to live experience with full awareness and presence. (paraphrased)"],
["الجسد ليس شيئاً، بل موقف.","The body is not a thing; it is a situation.","bea","نحن نعيش أجسادنا ضمن ظروف اجتماعية وتاريخية. (بتصرّف)","We live our bodies within social and historical circumstances. (paraphrased)"],
["أريد أن أتعلّم رؤية الجمال فيما هو ضروري.","I want to learn to see as beautiful what is necessary in things.","nie","ما يُسمّى حبّ القدر: قبول ما يحدث بل واحتضانه. (بتصرّف)","Known as amor fati: accepting what happens and even embracing it. (paraphrased)"],
["اللغة بيت الوجود.","Language is the house of being.","hei","نعيش داخل لغتنا، وبها نفهم ما حولنا. (بتصرّف)","We live inside our language and understand the world through it. (paraphrased)"],
["من لا يفكّر فيما هو بعيد يحزن لما هو قريب.","He who does not think of what is far will have sorrow near at hand.","con","التفكير بالعواقب يجنّبنا مشاكل قريبة. (بتصرّف)","Thinking ahead spares us trouble close by. (paraphrased)"],
["من يعرف لا يتكلم، ومن يتكلم لا يعرف.","Those who know do not speak; those who speak do not know.","lao","الحكمة الحقيقية هادئة، والادّعاء كثير الكلام. (بتصرّف)","True wisdom is quiet while pretension is talkative. (paraphrased)"],
["حياتنا محدودة والمعرفة بلا حدود.","Our life has a limit, but knowledge has none.","zhu","تذكير بأن لا نستنزف عمرنا في ملاحقة كل شيء. (بتصرّف)","A reminder not to spend our lives chasing everything. (paraphrased)"],
["التعلّم لا ينبغي أن يتوقف.","Learning should never cease.","xun","افتتاح كتاب شونزي: التعلّم مسيرة مستمرة طوال العمر.","The opening of Xunzi’s book: learning is a lifelong journey."],
["الرغبة هي جوهر الإنسان نفسه.","Desire is the very essence of man.","spi","رأى سبينوزا أن سعينا لما نحب هو ما يحرّك حياتنا. (بتصرّف)","Spinoza saw our striving for what we love as what drives our lives. (paraphrased)"],
["تبدأ كل معارفنا بالتجربة، لكن ليست كلها تنبع منها.","All our knowledge begins with experience, but not all of it arises from experience.","kan","عقولنا تُضيف إلى ما نراه بُنىً تنظّم فهمنا. (بتصرّف)","Our minds add structures that organize what we perceive. (paraphrased)"],
["الحرية هي طاعة قانون وضعناه لأنفسنا.","Liberty is obedience to a law we prescribe to ourselves.","rou","الحرية الحقيقية أن نحكم أنفسنا لا أن نفعل ما نشاء. (بتصرّف)","Real freedom is governing ourselves, not doing as we please. (paraphrased)"],
["الموهبة تصيب هدفاً لا يصيبه أحد، والعبقرية تصيب هدفاً لا يراه أحد.","Talent hits a target no one else can hit; genius hits a target no one else can see.","sch","فرق بين الإتقان والإبداع الذي يرى ما لا يُرى. (بتصرّف)","The difference between mastery and creativity that sees what others miss. (paraphrased)"],
["قيمة الفلسفة تكمن في كثير من الأحيان في عدم يقينها.","The value of philosophy lies to a great extent in its uncertainty.","rus","الأسئلة المفتوحة توسّع تفكيرنا وتحرّرنا من الأحكام الجاهزة. (بتصرّف)","Open questions widen our thinking and free us from ready-made judgments. (paraphrased)"],
["ما يمكن قوله يمكن قوله بوضوح.","What can be said at all can be said clearly.","wit","دعوة إلى الوضوح في الفكر والكلام. (بتصرّف)","A call for clarity in thought and speech. (paraphrased)"],
["أن تكون عظيماً يعني أن يُساء فهمك.","To be great is to be misunderstood.","eme","المبدعون غالباً يسبقون زمنهم فلا يفهمهم معاصروهم. (بتصرّف)","Original thinkers often outrun their time and are not understood by contemporaries. (paraphrased)"],
["الخُلُق حالٌ للنفس تدعوها إلى أفعالها من غير فكر ولا رويّة.","Character is a state of the soul that leads it to act without deliberation.","misk","تعريف مسكويه للخلق: صفة راسخة تظهر في التصرف تلقائياً. (بتصرّف)","Miskawayh’s definition of character: a settled trait that shows up spontaneously. (paraphrased)"],
["الحبّ أوّلُه هزلٌ وآخره جدّ.","Love begins as a jest and ends in earnest.","hazm","من كتاب طوق الحمامة: المشاعر الخفيفة قد تتحول إلى أمر عظيم.","From The Ring of the Dove: light feelings can grow into something serious."],
["أعلى الصناعات الإنسانية منزلةً وأشرفها مرتبةً صناعة الفلسفة.","The highest and noblest human craft is philosophy.","kin","افتتح الكندي فلسفته بتمجيد البحث عن الحقيقة. (بتصرّف)","Al-Kindi opened his philosophy by honoring the pursuit of truth. (paraphrased)"],
["لا إمام سوى العقل مشيراً في صبحه والمساء.","There is no leader but reason, guiding in the morning and the evening.","maa","من أشهر أبيات المعرّي في الاحتكام إلى العقل. (بتصرّف)","One of al-Maarri’s best-known lines on trusting reason. (paraphrased)"],
["الاعتماد على النقل وحده دون فهم طبائع العمران مظنّة للغلط.","Relying on transmission alone, without understanding how societies work, invites error.","khl","دعا ابن خلدون إلى فحص الأخبار بالعقل لا بمجرد الرواية. (بتصرّف)","Ibn Khaldun urged testing reports by reason, not by mere transmission. (paraphrased)"],
["ما أكثر الأشياء التي لا أحتاج إليها!","How many things there are that I do not need!","soc","قالها وهو يتأمل بضائع السوق، دعوة للقناعة. (منسوب إليه)","Said while looking over a marketplace, a call to contentment. (attributed)"],
["الزمن صورة متحركة للأبدية.","Time is a moving image of eternity.","pla","من محاورة طيماوس: تصوّر أفلاطون لعلاقة الزمن بالخلود. (بتصرّف)","From the Timaeus: Plato’s view of how time relates to the eternal. (paraphrased)"],
["كل صنعة وكل بحث، وكذلك كل فعل واختيار، يهدف إلى خير ما.","Every craft and every inquiry, and likewise every action and choice, aims at some good.","ari","افتتاح الأخلاق النيقوماخية: لكل ما نفعله غاية. (بتصرّف)","The opening of the Nicomachean Ethics: all we do has an aim. (paraphrased)"],
["أصعب الأشياء أن يعرف المرء نفسه، وأسهلها أن ينصح غيره.","The hardest thing is to know oneself, and the easiest is to advise others.","tha","مفارقة قديمة عن سهولة النقد وصعوبة المراجعة الذاتية. (منسوب إليه)","An old paradox about how easy it is to criticize and how hard to self-examine. (attributed)"],
["أنا مواطن في العالم.","I am a citizen of the world.","dio","من أولى العبارات التي دعت إلى انتماء إنساني يتجاوز المدن والدول. (منسوب إليه)","One of the earliest statements of a human belonging beyond cities and states. (attributed)"],
["لا يمكن أن نعيش بسرور من دون أن نعيش بحكمة وعدل.","It is impossible to live pleasantly without living wisely and justly.","epk","اللذة عند أبيقور ثمرة العقل والأخلاق لا الانغماس. (بتصرّف)","For Epicurus, pleasure is the fruit of reason and ethics, not indulgence. (paraphrased)"],
["نحن جميعاً عبيد للقانون لكي نكون أحراراً.","We are all servants of the law so that we may be free.","cic","القانون العادل يحمي الحرية من الفوضى. (بتصرّف)","A just law protects freedom from chaos. (paraphrased)"],
["لا يكون المرء حراً ما لم يكن سيّد نفسه.","No one is free who is not master of himself.","epi","الحرية الحقيقية تبدأ بالتحكم في رغباتنا. (منسوب إليه)","True freedom begins with mastery over our desires. (attributed)"],
["ليس عمرنا قصيراً، لكننا نضيّع جزءاً كبيراً منه.","It is not that we have a short time to live, but that we waste much of it.","sen","من رسالة قصر الحياة: المشكلة في إدارتنا للوقت. (بتصرّف)","From On the Shortness of Life: the problem is how we manage our time. (paraphrased)"],
["إن ضايقك أمر خارجي فالألم ليس منه، بل من حكمك عليه.","If you are distressed by something external, the pain is not from it but from your judgment of it.","aur","يمكننا أن نغيّر حكمنا فيخف الألم. (بتصرّف)","We can change our judgment and the pain eases. (paraphrased)"],
["أتمرّد، إذن نحن موجودون.","I rebel, therefore we exist.","cam","من كتاب المتمرّد: الاحتجاج على الظلم يربطنا بالآخرين. (بتصرّف)","From The Rebel: protest against injustice binds us to others. (paraphrased)"],
["أن نحوّل كل ما نحن عليه إلى ضوء ولهب.","To transform all that we are into light and flame.","nie","دعوة لجعل الحياة، بما فيها الألم، مصدر إشراق. (بتصرّف)","A call to turn life, even its pain, into radiance. (paraphrased)"],
["العالم ليس ما أفكّر به، بل ما أعيشه.","The world is not what I think, but what I live through.","mer","المعرفة تبدأ من تجربتنا الجسدية المعيشة قبل التفكير المجرّد. (بتصرّف)","Knowledge begins with lived bodily experience before abstract thought. (paraphrased)"],
["من راجع القديم عرف الجديد.","By reviewing the old, one comes to know the new.","con","فهم الماضي يُنير طريق الحاضر. (بتصرّف)","Understanding the past lights the way for the present. (paraphrased)"],
["أعلى الخير كالماء.","The highest good is like water.","lao","الماء يعطي الحياة بلا ضجيج ولا تنافس. (بتصرّف)","Water gives life without noise or rivalry. (paraphrased)"],
["لا تحدّث ضفدعاً في بئر عن البحر.","You cannot talk about the ocean to a frog in a well.","zhu","من لم يخرج من ضيق تجربته يصعب أن يتصور ما هو أوسع. (بتصرّف)","Someone who has not left a narrow experience can hardly imagine something wider. (paraphrased)"],
["حين تريد السماء أن تكلّف إنساناً بمهمة عظيمة، تُرهق عقله أولاً بالمعاناة.","When Heaven means to give a person a great task, it first tests his mind with hardship.","men","المصاعب تهيّئ الإنسان للمسؤوليات الكبيرة. (بتصرّف)","Hardship prepares a person for great responsibilities. (paraphrased)"],
["أطلت هذه الرسالة لأنه لم يكن عندي وقت لأقصّرها.","I made this letter longer because I did not have time to make it shorter.","pas","الاختصار الجيد يحتاج جهداً أكبر من الإطالة. (بتصرّف)","Good brevity takes more effort than length. (paraphrased)"],
["لا يكفي أن يكون العقل جيداً، المهم أن نُحسن استعماله.","It is not enough to have a good mind; the main thing is to use it well.","des","القدرة وحدها لا تكفي دون منهج وحسن توظيف. (بتصرّف)","Ability alone is not enough without method and good use. (paraphrased)"],
["الكراهية تزداد بالمبادلة، ويمكن أن تزول بالحب.","Hatred is increased by being returned, and can be destroyed by love.","spi","رأى سبينوزا أن الرد بالمحبة يوقف دائرة العداء. (بتصرّف)","Spinoza saw that answering with love ends the cycle of enmity. (paraphrased)"],
["هذا أفضل العوالم الممكنة.","This is the best of all possible worlds.","lei","رأي لايبنتز المتفائل الذي سخر منه فولتير لاحقاً.","Leibniz’s optimistic view, later mocked by Voltaire."],
["ماذا يمكنني أن أعرف؟ ماذا ينبغي أن أفعل؟ ماذا يحق لي أن أأمل؟","What can I know? What should I do? What may I hope?","kan","ثلاثة أسئلة لخّص بها كانط جوهر الفلسفة. (بتصرّف)","Three questions with which Kant summed up the heart of philosophy. (paraphrased)"],
["قد يكون الرأي الذي تُقمعه السلطة هو الحق.","An opinion that authority tries to suppress may be true.","mil","دفاع ميل عن حرية التعبير حتى للآراء المرفوضة. (بتصرّف)","Mill’s defense of free expression, even for unpopular views. (paraphrased)"],
["الحرية هي سبب وجود السياسة.","The reason for politics to exist is freedom.","are","رأت أرندت أن السياسة تهدف إلى حماية فضاء الحرية المشتركة. (بتصرّف)","Arendt saw politics as protecting the shared space of freedom. (paraphrased)"],
["معظم الناس يعيشون حياة هادئة من اليأس.","The mass of people lead lives of quiet desperation.","tho","ملاحظة ثورو عن الروتين الذي يبعدنا عن ما نريد فعلاً. (بتصرّف)","Thoreau’s observation about routine pulling us away from what we truly want. (paraphrased)"]
];
var T={
ar:{dir:"rtl",btn:"EN",title:"رقم وحكمة",sub:"اختر رقمك، وانظر أي فكرة تنتظرك خلفه",range:"اختر رقماً من 1 إلى ",go:"اكشف الحكمة",rand:"رقم عشوائي",hint:"كل رقم يخفي اقتباساً فلسفياً. جرّب رقمك الآن.",num:"الرقم ",meaning:"ما المقصود؟",about:"عن القائل",seenA:"اكتشفت ",seenB:" من ",seenC:" حكمة",priv:"سياسة الخصوصية",
    q1:"«",q2:"»"},
en:{dir:"ltr",btn:"ع",title:"Number and Wisdom",sub:"Pick a number and see which idea waits behind it",range:"Pick a number from 1 to ",go:"Reveal the wisdom",rand:"Random number",hint:"Every number hides a philosophical quote. Try yours now.",num:"Number ",priv:"Privacy Policy",
meaning:"What it means",about:"About the thinker",seenA:"You found ",seenB:" of ",seenC:" quotes",q1:"“",q2:"”"}
};
var CATS=[["all","كل الأقسام","All categories"],["arab","فلسفة عربية وإسلامية","Arab and Islamic"],["anc","الفلسفة القديمة","Ancient"],["sto","الرواقية","Stoicism"],["exi","الوجودية","Existentialism"],["eas","الفلسفة الشرقية","Eastern"],["mod","الفلسفة الحديثة","Modern"]];
var CAT={};
function mk(c,s){s.split(" ").forEach(function(k){CAT[k]=c;});}
mk("arab","gha khl rsh kin far hay arb maa");mk("anc","soc pla ari her pro epk cic del aug");mk("sto","epi sen aur");mk("exi","sar cam kie bea nie");mk("eas","con lao zhu men");mk("mod","des pas spi kan hum loc lei ber hob rou mil sch heg mar bac mon vol mac wit rus pop");
mk("arab","jah sin");mk("anc","dem");mk("sto","zen");mk("exi","hei");mk("eas","xun");mk("mod","eme");
mk("arab","misk hazm");mk("anc","tha dio");mk("exi","mer");mk("mod","are tho");
function ok(i){return catSel==="all"||CAT[Q[i][2]]===catSel;}
function buildCats(){var box=$("cats"),k=L==="ar"?1:2;box.innerHTML="";CATS.forEach(function(c){var b=el("button","chip"+(c[0]===catSel?" on":""),c[k]);b.addEventListener("click",function(){catSel=c[0];paint();});box.appendChild(b);});}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var N=Q.length,order=[],i,j,r=rng(20260);
for(i=0;i<N;i++)order.push(i);
for(i=N-1;i>0;i--){j=Math.floor(r()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}
var L="ar",cur=null,curQ=null,catSel="all",seen={};
try{L=localStorage.getItem("philo-lang")==="en"?"en":"ar";seen=JSON.parse(localStorage.getItem("philo-seen2")||"{}");}catch(e){}
var $=function(id){return document.getElementById(id);},numEl=$("num"),card=$("card");
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
function clamp(v){v=parseInt(v,10);if(isNaN(v)||v<1)v=1;if(v>N)v=N;return v;}
function paint(){
  var s=T[L],k=L==="ar"?0:1;
  document.documentElement.lang=L;document.documentElement.dir=s.dir;
  document.title=T.ar.title+" | "+T.en.title;
  $("priv").textContent=s.priv;
  $("lang").textContent=s.btn;$("t-title").textContent=s.title;$("t-sub").textContent=s.sub;
  $("range").textContent=s.range+N;$("go").textContent=s.go;$("rand").textContent=s.rand;
  buildCats();var inCat=0,got=0,kk;for(kk=0;kk<N;kk++){if(ok(kk)){inCat++;if(seen[kk])got++;}}$("seen").textContent=s.seenA+got+s.seenB+inCat+s.seenC;
  card.innerHTML="";
  if(cur===null){card.appendChild(el("p","hint",s.hint));return;}
  var q=Q[curQ],a=A[q[2]];
  card.appendChild(el("div","badge",s.num+cur));
  card.appendChild(el("p","quote",s.q1+q[k]+s.q2));
  card.appendChild(el("p","by",a[k]));
  var info=el("div","info");
  info.appendChild(el("h3","",s.meaning));info.appendChild(el("p","",q[3+k]));
  info.appendChild(el("h3","",s.about));info.appendChild(el("p","",a[2+k]));
  card.appendChild(info);
}
function reveal(){
  cur=clamp(numEl.value);numEl.value=cur;
  var filtered=[];
  for(var idx=0;idx<N;idx++){if(ok(order[idx]))filtered.push(order[idx]);}
  if(!filtered.length){filtered.push(0);}
  curQ=filtered[(cur-1)%filtered.length];
  seen[curQ]=1;
  try{localStorage.setItem("philo-seen2",JSON.stringify(seen));}catch(e){}
  paint();card.className="scroll";void card.offsetWidth;card.className="scroll show";
}
  
$("go").addEventListener("click",reveal);
$("rand").addEventListener("click",function(){numEl.value=1+Math.floor(Math.random()*N);reveal();});
$("plus").addEventListener("click",function(){numEl.value=clamp(clamp(numEl.value)+1);});
$("minus").addEventListener("click",function(){numEl.value=clamp(clamp(numEl.value)-1);});
numEl.addEventListener("keydown",function(e){if(e.key==="Enter")reveal();});
$("lang").addEventListener("click",function(){L=L==="ar"?"en":"ar";try{localStorage.setItem("philo-lang",L);}catch(e){}paint();});
paint();
</script>
